# The deployed stack: one Postgres cluster, Redis, and the API.
#
# Deliberately not the development compose file with overrides. That file
# publishes Postgres, Redis, MinIO and a mail catcher on host ports and uses
# `acmis`/`acmis` for everything, which is right for a laptop and wrong on a
# host that already runs eight other applications. Here only the API is
# reachable from outside; Postgres and Redis exist on the private compose
# network and have no published port at all.
#
# Every credential comes from `.env` beside this file. Nothing is defaulted:
# an unset `ACMIS_JWT_SECRET` in production makes `get_settings()` refuse to
# boot, which is the behaviour we want rather than a working deployment signing
# tokens with "dev-only-insecure-change-me".

name: acmis

services:
  postgres:
    image: postgres:17-alpine
    container_name: acmis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: acmis_control
      # `CREATE DATABASE ... LC_COLLATE 'en_US.UTF-8'` in provisioning fails
      # against the alpine image's default C locale, and provisioning is how
      # every new university arrives.
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8 --encoding=UTF8"
      LANG: en_US.utf8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./postgres-roles.sql:/docker-entrypoint-initdb.d/20-roles.sql:ro
    command:
      # A tenant engine holds up to 10 connections and 64 engines stay hot, so
      # this ceiling is sized alongside ACMIS_TENANT_ENGINE_CACHE_SIZE.
      - "postgres"
      - "-c"
      - "max_connections=400"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "log_min_duration_statement=500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d acmis_control"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: acmis-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    image: acmis-api:latest
    container_name: acmis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ACMIS_ENVIRONMENT: production
      ACMIS_DEBUG: "false"
      ACMIS_CONTROL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/acmis_control
      # One template, so rotating the cluster password is one variable and not
      # one UPDATE per tenant database.
      ACMIS_TENANT_DATABASE_URL_TEMPLATE: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/{database}
      ACMIS_REDIS_URL: redis://redis:6379/0
      ACMIS_JWT_SECRET: ${ACMIS_JWT_SECRET}
      ACMIS_TENANT_HOST_SUFFIX: ${ACMIS_TENANT_HOST_SUFFIX}
      ACMIS_CONTROL_PLANE_HOST: ${ACMIS_CONTROL_PLANE_HOST}
      ACMIS_CORS_ORIGINS: ${ACMIS_CORS_ORIGINS}
      ACMIS_MAIL_FROM: ${ACMIS_MAIL_FROM}
      # Off in production on purpose: a denial that names the deciding policy
      # tells an attacker the shape of the rule that stopped them.
      ACMIS_EXPLAIN_DENIALS: "false"
      ACMIS_AUDIT_ENABLED: "true"
    ports:
      - "${ACMIS_API_PORT}:8000"

volumes:
  pgdata:
  redisdata:
