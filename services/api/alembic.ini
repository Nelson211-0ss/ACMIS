# Two migration trees, one config.
#
# `alembic/control/` maps the tables that exist once for the whole platform;
# `alembic/tenant/` maps the tables that exist once per university. The
# `script_location` is set by the caller (`alembic -c alembic.ini -n control`
# or the provisioning code) rather than fixed here, because the tenant tree is
# run against a different database every time.
[alembic]
script_location = alembic/tenant
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
version_path_separator = os

[control]
script_location = alembic/control
sqlalchemy.url = postgresql+psycopg://acmis:acmis@localhost:5432/acmis_control

[tenant]
script_location = alembic/tenant
# Supplied per-run. A tenant tree with a hard-coded URL is a migration applied
# to the wrong university's database.
sqlalchemy.url =

[post_write_hooks]
# Formatting generated migrations is nice-to-have, not load-bearing, and a
# missing formatter must not fail a `revision` run. Enable by uncommenting
# once ruff is installed in the environment that generates migrations.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
